<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">🎂 Birthday</div>
            <ul class="nav-menu">

    <!-- Pictures Page -->
    <div class="page-container">
        <section class="pictures-section">
            <h1 class="page-title">📷 Photo Gallery</h1>
            <p class="page-subtitle">Beautiful memories together</p>

            <div class="gallery-container" id="galleryContainer">
                <!-- Photos will be displayed here -->
            </div>

            <!-- Empty State -->
            <div id="emptyGallery" class="empty-state">
                <p>🖼️ No photos yet</p>
                <p>Head to "Add Photos" to share beautiful memories!</p>
                <a href="add-photos.html" class="btn btn-primary">Add First Photo</a>

        </section>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <img id="lightboxImage" src="" alt="">
        <p id="lightboxCaption" class="lightbox-caption"></p>
